name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

env:
  ADDON: SwingTimerFader

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required to create releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate version
        id: version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${VERSION#v}" # accept "v1.0.0" too
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not like 1.0.0"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create addon zip
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # The zip must contain a folder named exactly like the .toc
          mkdir -p "build/$ADDON"

          rsync -av \
            --exclude='.git' --exclude='.github' --exclude='.gitignore' \
            --exclude='.agents' --exclude='.claude' --exclude='skills-lock.json' \
            --exclude='build' \
            ./ "build/$ADDON/"

          # Stamp the release version into the packaged .toc
          sed -i "s/^## Version:.*/## Version: $VERSION/" "build/$ADDON/$ADDON.toc"
          grep '^## Version:' "build/$ADDON/$ADDON.toc"

          (cd build && zip -r "../$ADDON-v$VERSION.zip" "$ADDON")

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ADDON }}-v${{ steps.version.outputs.VERSION }}.zip
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
