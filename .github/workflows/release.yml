name: Create Release

# Releases automatically when "## Version:" in the .toc is raised on main.
# Can also be run by hand (Actions -> Create Release -> Run workflow) to
# release the current .toc version if it hasn't been released yet.
on:
  push:
    branches: [main]
    paths: ['SwingTimerFader.toc']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  ADDON: SwingTimerFader

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required to create releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check version
        id: version
        run: |
          VERSION=$(grep -m1 '^## Version:' "$ADDON.toc" | sed 's/^## Version://' | tr -d '[:space:]')
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.toc version '$VERSION' is not like 1.0.0"
            exit 1
          fi

          # Highest existing vX.Y.Z tag (empty on the first release)
          LATEST=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||' \
            | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n1)
          echo "toc version: $VERSION, latest release: ${LATEST:-none}"

          if [ -n "$LATEST" ]; then
            HIGHEST=$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n1)
            if [ "$VERSION" = "$LATEST" ] || [ "$HIGHEST" != "$VERSION" ]; then
              echo "::notice::Version $VERSION is not higher than v$LATEST; skipping release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create addon zip
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.TAG }}
        run: |
          # The zip must contain a folder named exactly like the .toc
          mkdir -p "build/$ADDON"

          rsync -av \
            --exclude='.git' --exclude='.github' --exclude='.gitignore' \
            --exclude='.agents' --exclude='.claude' --exclude='skills-lock.json' \
            --exclude='CLAUDE.md' --exclude='build' \
            ./ "build/$ADDON/"

          (cd build && zip -r "../$ADDON-$TAG.zip" "$ADDON")

      - name: Create Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ADDON }}-${{ steps.version.outputs.TAG }}.zip
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Release ${{ steps.version.outputs.TAG }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
